name: Bug report / 问题反馈
description: Report a reproducible problem with the plugin.
body:
  - type: input
    id: environment
    attributes:
      label: Environment / 运行环境
      description: OS, Node.js version, Codex version and Hub version.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected behavior / 复现步骤与预期
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际结果
      description: Remove localhost session tokens, private paths and account information from logs and screenshots.
    validations:
      required: true
